name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            asset_arch: x64
            runner: windows-2022
          - arch: x86
            asset_arch: x86
            runner: windows-2022
          - arch: ARM64
            asset_arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run target tests
        shell: pwsh
        run: ./scripts/Build.ps1 -Architecture '${{ matrix.arch }}' -RequireTests -SkipPackage -NoPause
      - name: Test isolated full 7-Zip host
        shell: pwsh
        run: ./tests/Test-Host.ps1 -Architecture '${{ matrix.arch }}' -NoPause
      - name: Package CLI and Formats separately
        shell: pwsh
        run: ./scripts/Package.ps1 -Architecture '${{ matrix.arch }}' -RequireHostTests -NoPause
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-cli-${{ matrix.asset_arch }}
          path: release/vzip-cli-${{ matrix.asset_arch }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-formats-${{ matrix.asset_arch }}
          path: release/vzip-formats-${{ matrix.asset_arch }}.zip
          if-no-files-found: error
  attest:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [x64, x86, arm64]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-cli-${{ matrix.arch }}
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-formats-${{ matrix.arch }}
          path: release
      - name: Validate package layouts and architecture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          . ./scripts/Package.Common.ps1
          foreach ($component in @('cli', 'formats')) {
            $package = "release/vzip-$component-${{ matrix.arch }}.zip"
            Assert-PackageArchive $package $component '${{ matrix.arch }}'
            Expand-Archive -LiteralPath $package -DestinationPath "verified/$component-${{ matrix.arch }}"
          }
      - name: Attest packages and payloads
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/vzip-cli-${{ matrix.arch }}.zip
            release/vzip-formats-${{ matrix.arch }}.zip
            verified/cli-${{ matrix.arch }}/vzip.exe
            verified/formats-${{ matrix.arch }}/Formats/VZip.dll
      - name: Verify all four attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $targets = @('release/vzip-cli-${{ matrix.arch }}.zip', 'release/vzip-formats-${{ matrix.arch }}.zip', 'verified/cli-${{ matrix.arch }}/vzip.exe', 'verified/formats-${{ matrix.arch }}/Formats/VZip.dll')
          foreach ($target in $targets) {
            gh attestation verify $target --repo '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/ci.yml' --source-digest '${{ github.sha }}' --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed: $target" }
          }
  release-preview:
    needs: [build, attest]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Validate release inputs and preview bilingual notes
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(VZipCli VERSION ([0-9]+\.[0-9]+\.[0-9]+) ') { throw 'Project version missing' }
          $version = $Matches[1]
          ./.github/scripts/Write-ReleaseNotes.ps1 -Repository '${{ github.repository }}' -Tag "v$version" -SourceSha '${{ github.sha }}' -RunId '${{ github.run_id }}' -PackageDirectory release -NotesPath '.local/release-preview.md'
